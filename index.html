<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Salud</title>
<meta name="theme-color" content="#0079c8">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css?v=202610251900">
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div>
      <div class="hero-kicker">Mi Salud</div>
      <h1 id="saludo">Hola</h1>
    </div>
    <div class="hero-acciones">
      <button type="button" class="icon-btn" id="btnFichas" aria-label="Ver otras fichas" title="Otras fichas" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnRecargar" aria-label="Actualizar datos" title="Actualizar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnSalir" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </div>
  <div class="hero-chips" id="heroChips"></div>
</header>

<main class="container">
  <div id="cargando" class="cargando">Cargando tus datos…</div>
  <div id="error" class="aviso-error" hidden></div>

  <section id="vista-inicio" class="vista" hidden></section>
  <section id="vista-indicadores" class="vista" hidden></section>
  <section id="vista-examenes" class="vista" hidden></section>
  <section id="vista-metas" class="vista" hidden></section>
  <section id="vista-plan" class="vista" hidden></section>

  <p class="pie" id="pie" hidden>Esta app es un apoyo para ordenar y entender tus exámenes. Los diagnósticos y tratamientos los define tu médico.</p>
</main>

<nav class="tabbar" aria-label="Secciones">
  <a href="#inicio" data-tab="inicio">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Inicio</span>
  </a>
  <a href="#indicadores" data-tab="indicadores">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    <span>Indicadores</span>
  </a>
  <a href="#examenes" data-tab="examenes">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
    <span>Exámenes</span>
  </a>
  <a href="#metas" data-tab="metas">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
    <span>Metas</span>
  </a>
  <a href="#plan" data-tab="plan">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    <span>Plan</span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="hoja-fondo" id="hojaFondo" hidden>
  <div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo">
    <button type="button" class="hoja-cerrar" id="hojaCerrar" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="hojaContenido"></div>
  </div>
</div>

<script src="js/config.js?v=202610251900"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/sheets-auth.js?v=202610251900"></script>
<script src="js/metas.js?v=202610251900"></script>
<script src="js/agenda.js?v=202610251900"></script>
<script src="js/app.js?v=202610251900"></script>
</body>
</html>
